site_name: SMILE
site_description: Soundscape engineering with metamaterial innovation and learning
site_url: https://smile-acoustics.se/

theme:
  name: material
  language: en
  custom_dir: overrides
  font: false
  logo: assets/smile-mark.svg
  favicon: assets/smile-mark.svg
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.footer
    - navigation.top
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - scheme: default
      primary: custom
      accent: custom

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/zibo-kth/smile-project-site
      name: SMILE on GitHub
    - icon: material/account-school
      link: https://www.kth.se/profile/zibo?l=en
      name: Project leader at KTH
    - icon: material/email-outline
      link: mailto:zibo@kth.se
      name: Contact SMILE

copyright: SMILE · Swedish Research Council grant 2025-06253 · KTH Royal Institute of Technology

plugins:
  - search
  - minify:
      minify_html: true

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Research:
      - Vision: about.md
      - Technology Roadmap: work-packages.md
      - Acoustic Metamaterials: metamaterials.md
  - Outputs:
      - Publications & Resources: results.md
      - Updates: news.md
  - People & Support:
      - Team: team.md
      - Funding & Collaboration: funding.md
  - Contact: contact.md
