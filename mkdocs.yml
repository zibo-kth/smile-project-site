site_name: SMILE Project
site_description: SMILE — Soundscape engineering with Metamaterial Innovation and LEarning
site_url: https://smile-acoustics.se/

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
  palette:
    - scheme: default
      primary: indigo
      accent: indigo

extra_css:
  - stylesheets/site.css

extra_javascript:
  - javascripts/accessibility.js

plugins:
  - search
  - minify:
      minify_html: true

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true

nav:
  - Home: index.md
  - About / Vision: about.md
  - Work Packages: work-packages.md
  - Acoustic Metamaterials: metamaterials.md
  - Results: results.md
  - News: news.md
  - Team: team.md
  - Funding: funding.md
  - Contact: contact.md
