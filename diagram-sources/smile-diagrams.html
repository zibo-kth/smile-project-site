<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SMILE diagram source sheet</title>
  <style>
    :root { color-scheme: light; }
    body { margin: 0; padding: 32px; color: #182635; background: #eef3f7; font-family: Arial, Helvetica, sans-serif; }
    main { max-width: 1400px; margin: 0 auto; }
    section { margin: 0 0 32px; padding: 24px; background: #fff; border: 1px solid #d9e3ec; border-radius: 20px; }
    h1 { margin: 0 0 8px; color: #0b1f33; }
    p { margin: 0 0 20px; color: #536476; }
    svg { display: block; width: 100%; height: auto; }
  </style>
</head>
<body>
<main>
  <h1>SMILE diagram source sheet</h1>
  <p>Editable inline-SVG source for the public research workflow and technology roadmap. Flat colours, system fonts, and no external dependencies.</p>

  <section>
    <svg viewBox="0 0 1260 650" role="img" aria-labelledby="workflow-title workflow-desc">
      <title id="workflow-title">SMILE research workflow</title>
      <desc id="workflow-desc">Five stages connect soundscape observation to modelling, inverse design, prototyping, and participant evaluation.</desc>
      <rect x="1" y="1" width="1258" height="648" rx="30" fill="#f7fafc" stroke="#d9e3ec" stroke-width="2"/>
      <text x="70" y="75" fill="#0b1f33" font-size="34" font-weight="700">From soundscape evidence to acoustic intervention</text>
      <text x="70" y="112" fill="#536476" font-size="20">Physical, perceptual, and practical evidence remain distinct.</text>
      <g fill="none" stroke="#7690a8" stroke-width="4" stroke-linecap="round">
        <path d="M280 293h48M522 293h48M764 293h48M1006 293h48"/>
      </g>
      <g transform="translate(55 176)"><rect width="225" height="235" rx="22" fill="#e7f6f2" stroke="#8dcac2" stroke-width="2"/><circle cx="39" cy="42" r="22" fill="#0d766e"/><text x="39" y="50" fill="#fff" font-size="20" font-weight="700" text-anchor="middle">1</text><text x="25" y="92" fill="#0b1f33" font-size="24" font-weight="700">Observe</text><text x="25" y="121" fill="#0b1f33" font-size="24" font-weight="700">and define</text><text x="25" y="164" fill="#536476" font-size="16">Context, sound,</text><text x="25" y="190" fill="#536476" font-size="16">reported outcomes,</text><text x="25" y="216" fill="#536476" font-size="16">design targets.</text></g>
      <g transform="translate(297 176)"><rect width="225" height="235" rx="22" fill="#eaf3ff" stroke="#a9c8e9" stroke-width="2"/><circle cx="39" cy="42" r="22" fill="#2459c4"/><text x="39" y="50" fill="#fff" font-size="20" font-weight="700" text-anchor="middle">2</text><text x="25" y="92" fill="#0b1f33" font-size="24" font-weight="700">Model and</text><text x="25" y="121" fill="#0b1f33" font-size="24" font-weight="700">characterise</text><text x="25" y="164" fill="#536476" font-size="16">Physics, measurement,</text><text x="25" y="190" fill="#536476" font-size="16">and uncertainty.</text></g>
      <g transform="translate(539 176)"><rect width="225" height="235" rx="22" fill="#fff6e5" stroke="#e7ca8b" stroke-width="2"/><circle cx="39" cy="42" r="22" fill="#b96f00"/><text x="39" y="50" fill="#fff" font-size="20" font-weight="700" text-anchor="middle">3</text><text x="25" y="92" fill="#0b1f33" font-size="24" font-weight="700">Inverse-design</text><text x="25" y="121" fill="#0b1f33" font-size="24" font-weight="700">candidates</text><text x="25" y="164" fill="#536476" font-size="16">Search the design</text><text x="25" y="190" fill="#536476" font-size="16">space with constraints.</text></g>
      <g transform="translate(781 176)"><rect width="225" height="235" rx="22" fill="#edf0f8" stroke="#c8cfdf" stroke-width="2"/><circle cx="39" cy="42" r="22" fill="#45567a"/><text x="39" y="50" fill="#fff" font-size="20" font-weight="700" text-anchor="middle">4</text><text x="25" y="92" fill="#0b1f33" font-size="24" font-weight="700">Prototype</text><text x="25" y="121" fill="#0b1f33" font-size="24" font-weight="700">and test</text><text x="25" y="164" fill="#536476" font-size="16">Compare predictions,</text><text x="25" y="190" fill="#536476" font-size="16">measurements, baselines.</text></g>
      <g transform="translate(1023 176)"><rect width="182" height="235" rx="22" fill="#e7f6f2" stroke="#8dcac2" stroke-width="2"/><circle cx="39" cy="42" r="22" fill="#0d766e"/><text x="39" y="50" fill="#fff" font-size="20" font-weight="700" text-anchor="middle">5</text><text x="25" y="92" fill="#0b1f33" font-size="22" font-weight="700">Evaluate</text><text x="25" y="120" fill="#0b1f33" font-size="22" font-weight="700">and translate</text><text x="25" y="164" fill="#536476" font-size="14">Participant evidence</text><text x="25" y="190" fill="#536476" font-size="14">and supported range.</text></g>
      <path d="M1113 432v77c0 36-29 65-65 65H190c-36 0-65-29-65-65v-77" fill="none" stroke="#0d766e" stroke-width="5" stroke-linecap="round"/>
      <rect x="421" y="535" width="420" height="60" rx="30" fill="#0b1f33"/>
      <text x="631" y="574" fill="#fff" font-size="20" font-weight="700" text-anchor="middle">Evidence updates the targets and models</text>
    </svg>
  </section>

  <section>
    <svg viewBox="0 0 1400 560" role="img" aria-labelledby="roadmap-title roadmap-desc">
      <title id="roadmap-title">SMILE technology roadmap</title>
      <desc id="roadmap-desc">Four indicative phases: foundations, design, prototype, and demonstration.</desc>
      <rect x="1" y="1" width="1398" height="558" rx="30" fill="#f7fafc" stroke="#d9e3ec" stroke-width="2"/>
      <text x="65" y="72" fill="#0b1f33" font-size="36" font-weight="700">Technology roadmap</text>
      <text x="65" y="112" fill="#536476" font-size="20">Indicative emphasis by year; activities overlap as evidence develops.</text>
      <g transform="translate(55 160)"><rect width="295" height="315" rx="24" fill="#e7f6f2" stroke="#8dcac2" stroke-width="2"/><text x="28" y="50" fill="#0d766e" font-size="20" font-weight="700">2026</text><text x="28" y="92" fill="#0b1f33" font-size="29" font-weight="700">Foundations</text><text x="28" y="150" fill="#182635" font-size="18" font-weight="700">Targets + benchmarks</text><text x="28" y="184" fill="#536476" font-size="16">Reference cases, models,</text><text x="28" y="210" fill="#536476" font-size="16">measurements, protocols.</text></g>
      <g transform="translate(380 160)"><rect width="295" height="315" rx="24" fill="#eaf3ff" stroke="#a9c8e9" stroke-width="2"/><text x="28" y="50" fill="#2459c4" font-size="20" font-weight="700">2027</text><text x="28" y="92" fill="#0b1f33" font-size="29" font-weight="700">Design</text><text x="28" y="150" fill="#182635" font-size="18" font-weight="700">Candidate structures</text><text x="28" y="184" fill="#536476" font-size="16">Physics + ML-assisted</text><text x="28" y="210" fill="#536476" font-size="16">constrained search.</text></g>
      <g transform="translate(705 160)"><rect width="295" height="315" rx="24" fill="#fff6e5" stroke="#e7ca8b" stroke-width="2"/><text x="28" y="50" fill="#a86400" font-size="20" font-weight="700">2028</text><text x="28" y="92" fill="#0b1f33" font-size="29" font-weight="700">Prototype</text><text x="28" y="150" fill="#182635" font-size="18" font-weight="700">Build + test</text><text x="28" y="184" fill="#536476" font-size="16">Prediction-to-measurement</text><text x="28" y="210" fill="#536476" font-size="16">comparison.</text></g>
      <g transform="translate(1030 160)"><rect width="315" height="315" rx="24" fill="#edf0f8" stroke="#c8cfdf" stroke-width="2"/><text x="28" y="50" fill="#45567a" font-size="20" font-weight="700">2029</text><text x="28" y="92" fill="#0b1f33" font-size="29" font-weight="700">Demonstrate</text><text x="28" y="150" fill="#182635" font-size="18" font-weight="700">Evaluate + translate</text><text x="28" y="184" fill="#536476" font-size="16">Supported scenarios,</text><text x="28" y="210" fill="#536476" font-size="16">guidance, reusable outputs.</text></g>
    </svg>
  </section>
</main>
