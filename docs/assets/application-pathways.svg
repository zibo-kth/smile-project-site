<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative SMILE application pathways</title>
  <desc id="desc">Two illustrative pathways show how an indoor vehicle-cabin scenario and a traffic-exposed public-space scenario can move from context-specific targets to acoustic intervention and evaluation.</desc>
  <rect x="1" y="1" width="1198" height="598" rx="30" fill="#f7fafc" stroke="#d9e3ec" stroke-width="2"/>
  <text x="58" y="69" fill="#0b1f33" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">Illustrative application pathways</text>
  <text x="58" y="107" fill="#536476" font-family="Arial, Helvetica, sans-serif" font-size="19">The intervention and outcome measures must be tailored to each context.</text>

  <g transform="translate(55 150)">
    <rect width="1090" height="168" rx="24" fill="#eaf3ff" stroke="#a9c8e9" stroke-width="2"/>
    <rect width="218" height="168" rx="24" fill="#0b1f33"/>
    <path d="M54 78h110l24 27H31l23-27Z" fill="none" stroke="#77ddd2" stroke-width="5" stroke-linejoin="round"/>
    <circle cx="67" cy="112" r="13" fill="none" stroke="#fff" stroke-width="5"/><circle cx="155" cy="112" r="13" fill="none" stroke="#fff" stroke-width="5"/>
    <text x="109" y="146" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="middle">VEHICLE CABIN</text>

    <text x="252" y="45" fill="#2459c4" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">CONTEXT + TARGETS</text>
    <text x="252" y="76" fill="#0b1f33" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Operating sound · space</text>
    <text x="252" y="100" fill="#0b1f33" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Occupant experience</text>
    <text x="252" y="130" fill="#536476" font-family="Arial, Helvetica, sans-serif" font-size="15">Define acoustic targets and</text>
    <text x="252" y="152" fill="#536476" font-family="Arial, Helvetica, sans-serif" font-size="15">packaging constraints.</text>
    <path d="M598 84h58" stroke="#7890a5" stroke-width="4" stroke-linecap="round"/><path d="m643 71 17 13-17 13" fill="none" stroke="#7890a5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="686" y="45" fill="#2459c4" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">INTERVENTION + EVIDENCE</text>
    <text x="686" y="78" fill="#0b1f33" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Candidate acoustic interface</text>
    <text x="686" y="112" fill="#536476" font-family="Arial, Helvetica, sans-serif" font-size="15">Measure acoustic performance.</text>
    <text x="686" y="136" fill="#536476" font-family="Arial, Helvetica, sans-serif" font-size="15">Evaluate comfort and appropriateness.</text>
  </g>

  <g transform="translate(55 352)">
    <rect width="1090" height="168" rx="24" fill="#e7f6f2" stroke="#8dcac2" stroke-width="2"/>
    <rect width="218" height="168" rx="24" fill="#0d766e"/>
    <path d="M30 118h158" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
    <path d="M38 118c25-43 49-43 74 0 26-54 49-54 75 0" fill="none" stroke="#77ddd2" stroke-width="5" stroke-linecap="round"/>
    <circle cx="64" cy="55" r="18" fill="none" stroke="#fff" stroke-width="5"/><path d="M64 73v45" stroke="#fff" stroke-width="5"/>
    <circle cx="158" cy="45" r="18" fill="none" stroke="#fff" stroke-width="5"/><path d="M158 63v55" stroke="#fff" stroke-width="5"/>
    <text x="109" y="146" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="middle">PUBLIC SPACE</text>

    <text x="252" y="45" fill="#0d766e" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">CONTEXT + TARGETS</text>
    <text x="252" y="76" fill="#0b1f33" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Traffic exposure · place use</text>
    <text x="252" y="100" fill="#0b1f33" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Listener context</text>
    <text x="252" y="130" fill="#536476" font-family="Arial, Helvetica, sans-serif" font-size="15">Define measurable acoustic</text>
    <text x="252" y="152" fill="#536476" font-family="Arial, Helvetica, sans-serif" font-size="15">and reported outcomes.</text>
    <path d="M598 84h58" stroke="#7890a5" stroke-width="4" stroke-linecap="round"/><path d="m643 71 17 13-17 13" fill="none" stroke="#7890a5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="686" y="45" fill="#0d766e" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">INTERVENTION + EVIDENCE</text>
    <text x="686" y="76" fill="#0b1f33" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Candidate barrier or</text>
    <text x="686" y="100" fill="#0b1f33" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">spatial element</text>
    <text x="686" y="130" fill="#536476" font-family="Arial, Helvetica, sans-serif" font-size="15">Test acoustic effect and</text>
    <text x="686" y="152" fill="#536476" font-family="Arial, Helvetica, sans-serif" font-size="15">context-appropriate perception.</text>
  </g>

  <rect x="362" y="545" width="476" height="34" rx="17" fill="#0b1f33"/>
  <text x="600" y="568" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="middle">CONCEPT SCENARIOS · NOT DEPLOYED INTERVENTIONS</text>
</svg>
