<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 790" role="img" aria-labelledby="title desc">
  <title id="title">SMILE technology roadmap for 2026 to 2029</title>
  <desc id="desc">An indicative four-year roadmap progressing from foundations through design and prototyping to demonstration and translation, with physical, human, and practical evidence gates.</desc>
  <rect x="1" y="1" width="1398" height="788" rx="30" fill="#f7fafc" stroke="#d9e3ec" stroke-width="2"/>
  <text x="65" y="72" fill="#0b1f33" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700">Technology roadmap</text>
  <text x="65" y="112" fill="#536476" font-family="Arial, Helvetica, sans-serif" font-size="20">Indicative emphasis by year; activities overlap and adapt as evidence develops.</text>

  <g fill="none" stroke="#7890a5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M350 314h45"/><path d="m382 301 17 13-17 13"/>
    <path d="M675 314h45"/><path d="m707 301 17 13-17 13"/>
    <path d="M1000 314h45"/><path d="m1032 301 17 13-17 13"/>
  </g>

  <g transform="translate(55 160)">
    <rect width="295" height="315" rx="24" fill="#e7f6f2" stroke="#8dcac2" stroke-width="2"/>
    <text x="28" y="48" fill="#0d766e" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">2026</text>
    <text x="28" y="88" fill="#0b1f33" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700">Foundations</text>
    <path d="M28 112h239" stroke="#8dcac2" stroke-width="2"/>
    <text x="28" y="153" fill="#182635" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">Define reference cases</text>
    <text x="28" y="184" fill="#536476" font-family="Arial, Helvetica, sans-serif" font-size="15">Acoustic + perceptual targets</text>
    <text x="28" y="218" fill="#182635" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">Build the evidence base</text>
    <text x="28" y="249" fill="#536476" font-family="Arial, Helvetica, sans-serif" font-size="15">Models, measurements, protocols</text>
    <rect x="28" y="272" width="196" height="28" rx="14" fill="#0d766e"/>
    <text x="126" y="292" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="middle">TARGETS + BENCHMARKS</text>
  </g>

  <g transform="translate(380 160)">
    <rect width="295" height="315" rx="24" fill="#eaf3ff" stroke="#a9c8e9" stroke-width="2"/>
    <text x="28" y="48" fill="#2459c4" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">2027</text>
    <text x="28" y="88" fill="#0b1f33" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700">Design</text>
    <path d="M28 112h239" stroke="#a9c8e9" stroke-width="2"/>
    <text x="28" y="153" fill="#182635" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">Explore the design space</text>
    <text x="28" y="184" fill="#536476" font-family="Arial, Helvetica, sans-serif" font-size="15">Physics + ML-assisted search</text>
    <text x="28" y="218" fill="#182635" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">Rank feasible candidates</text>
    <text x="28" y="249" fill="#536476" font-family="Arial, Helvetica, sans-serif" font-size="15">Performance + constraints</text>
    <rect x="28" y="272" width="196" height="28" rx="14" fill="#2459c4"/>
    <text x="126" y="292" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="middle">CANDIDATE DESIGNS</text>
  </g>

  <g transform="translate(705 160)">
    <rect width="295" height="315" rx="24" fill="#fff6e5" stroke="#e7ca8b" stroke-width="2"/>
    <text x="28" y="48" fill="#a86400" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">2028</text>
    <text x="28" y="88" fill="#0b1f33" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700">Prototype</text>
    <path d="M28 112h239" stroke="#e7ca8b" stroke-width="2"/>
    <text x="28" y="153" fill="#182635" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">Manufacture concepts</text>
    <text x="28" y="184" fill="#536476" font-family="Arial, Helvetica, sans-serif" font-size="15">Document materials + geometry</text>
    <text x="28" y="218" fill="#182635" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">Test against predictions</text>
    <text x="28" y="249" fill="#536476" font-family="Arial, Helvetica, sans-serif" font-size="15">Lab evidence + model updates</text>
    <rect x="28" y="272" width="196" height="28" rx="14" fill="#a86400"/>
    <text x="126" y="292" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="middle">VALIDATED PROTOTYPES</text>
  </g>

  <g transform="translate(1030 160)">
    <rect width="315" height="315" rx="24" fill="#edf0f8" stroke="#c8cfdf" stroke-width="2"/>
    <text x="28" y="48" fill="#45567a" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">2029</text>
    <text x="28" y="88" fill="#0b1f33" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700">Demonstrate</text>
    <path d="M28 112h259" stroke="#c8cfdf" stroke-width="2"/>
    <text x="28" y="153" fill="#182635" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">Evaluate selected cases</text>
    <text x="28" y="184" fill="#536476" font-family="Arial, Helvetica, sans-serif" font-size="15">Participant-study evidence</text>
    <text x="28" y="218" fill="#182635" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">Translate the findings</text>
    <text x="28" y="249" fill="#536476" font-family="Arial, Helvetica, sans-serif" font-size="15">Guidance + reusable outputs</text>
    <rect x="28" y="272" width="216" height="28" rx="14" fill="#45567a"/>
    <text x="136" y="292" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="middle">SUPPORTED DESIGN RANGE</text>
  </g>

  <text x="65" y="550" fill="#0b1f33" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">Evidence gates across all stages</text>

  <g transform="translate(55 585)">
    <rect width="405" height="132" rx="20" fill="#eaf3ff" stroke="#a9c8e9" stroke-width="2"/>
    <circle cx="42" cy="43" r="20" fill="#2459c4"/>
    <path d="M32 43h20M42 33v20" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
    <text x="76" y="47" fill="#0b1f33" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">Physical evidence</text>
    <text x="28" y="83" fill="#536476" font-family="Arial, Helvetica, sans-serif" font-size="17">Prediction, measurement, uncertainty,</text>
    <text x="28" y="108" fill="#536476" font-family="Arial, Helvetica, sans-serif" font-size="17">and comparison with a baseline.</text>
  </g>

  <g transform="translate(498 585)">
    <rect width="405" height="132" rx="20" fill="#e7f6f2" stroke="#8dcac2" stroke-width="2"/>
    <circle cx="42" cy="43" r="20" fill="#0d766e"/>
    <path d="M32 44c7-11 13-11 20 0" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
    <circle cx="35" cy="36" r="3" fill="#fff"/><circle cx="49" cy="36" r="3" fill="#fff"/>
    <text x="76" y="47" fill="#0b1f33" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">Human evidence</text>
    <text x="28" y="83" fill="#536476" font-family="Arial, Helvetica, sans-serif" font-size="17">Participant-reported outcomes evaluated</text>
    <text x="28" y="108" fill="#536476" font-family="Arial, Helvetica, sans-serif" font-size="17">with a predeclared protocol.</text>
  </g>

  <g transform="translate(941 585)">
    <rect width="404" height="132" rx="20" fill="#fff6e5" stroke="#e7ca8b" stroke-width="2"/>
    <circle cx="42" cy="43" r="20" fill="#a86400"/>
    <path d="m31 43 8 8 15-18" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="76" y="47" fill="#0b1f33" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">Practical evidence</text>
    <text x="28" y="83" fill="#536476" font-family="Arial, Helvetica, sans-serif" font-size="17">Space, mass, robustness,</text>
    <text x="28" y="108" fill="#536476" font-family="Arial, Helvetica, sans-serif" font-size="17">manufacturing + sustainability.</text>
  </g>
</svg>
