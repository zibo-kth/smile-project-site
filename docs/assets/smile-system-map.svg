<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 650" role="img" aria-labelledby="title desc">
  <title id="title">SMILE research workflow</title>
  <desc id="desc">A five-stage evidence loop from soundscape observation to modelling, inverse design, prototyping, and participant evaluation, with findings returning to refine the targets.</desc>
  <rect x="1" y="1" width="1258" height="648" rx="30" fill="#f7fafc" stroke="#d9e3ec" stroke-width="2"/>
  <text x="70" y="75" fill="#0b1f33" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">From soundscape evidence to acoustic intervention</text>
  <text x="70" y="112" fill="#536476" font-family="Arial, Helvetica, sans-serif" font-size="20">Each design claim is checked against physical, perceptual, and practical evidence.</text>

  <g stroke="#7690a8" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M280 293h48"/>
    <path d="m314 280 17 13-17 13"/>
    <path d="M522 293h48"/>
    <path d="m556 280 17 13-17 13"/>
    <path d="M764 293h48"/>
    <path d="m798 280 17 13-17 13"/>
    <path d="M1006 293h48"/>
    <path d="m1040 280 17 13-17 13"/>
  </g>

  <g transform="translate(55 176)">
    <rect width="225" height="235" rx="22" fill="#e7f6f2" stroke="#8dcac2" stroke-width="2"/>
    <circle cx="39" cy="42" r="22" fill="#0d766e"/>
    <text x="39" y="50" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="middle">1</text>
    <text x="25" y="91" fill="#0b1f33" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">Observe</text>
    <text x="25" y="120" fill="#0b1f33" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">and define</text>
    <text x="25" y="154" fill="#536476" font-family="Arial, Helvetica, sans-serif" font-size="15">Measure sound</text>
    <text x="25" y="178" fill="#536476" font-family="Arial, Helvetica, sans-serif" font-size="15">and context.</text>
    <text x="25" y="202" fill="#536476" font-family="Arial, Helvetica, sans-serif" font-size="15">Define reported outcomes</text>
    <text x="25" y="226" fill="#536476" font-family="Arial, Helvetica, sans-serif" font-size="15">and design targets.</text>
  </g>

  <g transform="translate(297 176)">
    <rect width="225" height="235" rx="22" fill="#eaf3ff" stroke="#a9c8e9" stroke-width="2"/>
    <circle cx="39" cy="42" r="22" fill="#2459c4"/>
    <text x="39" y="50" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="middle">2</text>
    <text x="25" y="91" fill="#0b1f33" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">Model and</text>
    <text x="25" y="120" fill="#0b1f33" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">characterise</text>
    <text x="25" y="162" fill="#536476" font-family="Arial, Helvetica, sans-serif" font-size="15">Predict wave behaviour.</text>
    <text x="25" y="190" fill="#536476" font-family="Arial, Helvetica, sans-serif" font-size="15">Characterise structures.</text>
    <text x="25" y="216" fill="#536476" font-family="Arial, Helvetica, sans-serif" font-size="15">Quantify uncertainty.</text>
  </g>

  <g transform="translate(539 176)">
    <rect width="225" height="235" rx="22" fill="#fff6e5" stroke="#e7ca8b" stroke-width="2"/>
    <circle cx="39" cy="42" r="22" fill="#b96f00"/>
    <text x="39" y="50" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="middle">3</text>
    <text x="25" y="91" fill="#0b1f33" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">Inverse-design</text>
    <text x="25" y="120" fill="#0b1f33" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">candidates</text>
    <text x="25" y="162" fill="#536476" font-family="Arial, Helvetica, sans-serif" font-size="15">Explore candidate designs.</text>
    <text x="25" y="190" fill="#536476" font-family="Arial, Helvetica, sans-serif" font-size="15">Respect engineering</text>
    <text x="25" y="216" fill="#536476" font-family="Arial, Helvetica, sans-serif" font-size="15">constraints.</text>
  </g>

  <g transform="translate(781 176)">
    <rect width="225" height="235" rx="22" fill="#edf0f8" stroke="#c8cfdf" stroke-width="2"/>
    <circle cx="39" cy="42" r="22" fill="#45567a"/>
    <text x="39" y="50" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="middle">4</text>
    <text x="25" y="91" fill="#0b1f33" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">Prototype</text>
    <text x="25" y="120" fill="#0b1f33" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">and test</text>
    <text x="25" y="162" fill="#536476" font-family="Arial, Helvetica, sans-serif" font-size="15">Build selected concepts.</text>
    <text x="25" y="190" fill="#536476" font-family="Arial, Helvetica, sans-serif" font-size="15">Compare predictions,</text>
    <text x="25" y="216" fill="#536476" font-family="Arial, Helvetica, sans-serif" font-size="15">measurements, baselines.</text>
  </g>

  <g transform="translate(1023 176)">
    <rect width="182" height="235" rx="22" fill="#e7f6f2" stroke="#8dcac2" stroke-width="2"/>
    <circle cx="39" cy="42" r="22" fill="#0d766e"/>
    <text x="39" y="50" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="middle">5</text>
    <text x="25" y="91" fill="#0b1f33" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">Evaluate</text>
    <text x="25" y="119" fill="#0b1f33" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">and translate</text>
    <text x="25" y="150" fill="#536476" font-family="Arial, Helvetica, sans-serif" font-size="14">Test participant</text>
    <text x="25" y="174" fill="#536476" font-family="Arial, Helvetica, sans-serif" font-size="14">outcomes.</text>
    <text x="25" y="198" fill="#536476" font-family="Arial, Helvetica, sans-serif" font-size="14">Define the supported</text>
    <text x="25" y="222" fill="#536476" font-family="Arial, Helvetica, sans-serif" font-size="14">range.</text>
  </g>

  <path d="M1113 432v77c0 36-29 65-65 65H190c-36 0-65-29-65-65v-77" fill="none" stroke="#0d766e" stroke-width="5" stroke-linecap="round"/>
  <path d="m111 451 14-19 14 19" fill="none" stroke="#0d766e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="421" y="535" width="420" height="60" rx="30" fill="#0b1f33"/>
  <text x="631" y="574" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="middle">Evidence updates the targets and models</text>
</svg>
